## Donut Chart Rules

Use `PyQt6.QtCharts`:

- `QPieSeries`
- `QChart`

### Show:
- Top 5 Most Sold Products

### Color Buckets:
| Percentage | Color  |
|------------|--------|
| 0–25%      | Red    |
| 25–50%     | Orange |
| 50–75%     | Blue   |
| 75%+       | Green  |

### Hover Popup:
Show:
- Product Name
- Barcode
- Sold Percentage

